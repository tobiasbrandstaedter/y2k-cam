<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>spike: image-pipeline</title>
    <link rel="stylesheet" href="../common/style.css" />
  </head>
  <body>
    <h1>spike: image-pipeline</h1>
    <p>
      Targets QA-2: tapping a Look on a 12 MP photo shows the result in under 0.5 s. Four chained
      WebGL2 passes (Farbcharakter, Kompressionsbloecke, Rauschen, Vignette) versus a Canvas 2D
      baseline.
    </p>

    <h2>1. Photo</h2>
    <input id="file" type="file" accept="image/*" />
    <table id="photo"></table>

    <h2>2. Tap a Look (each tap is timed)</h2>
    <div class="row">
      <button class="look primary" data-look="digicam" disabled>Digicam</button>
      <button class="look" data-look="handy" disabled>Handykamera</button>
      <button class="look" data-look="einweg" disabled>Einwegkamera</button>
      <button class="look" data-look="camcorder" disabled>Camcorder</button>
      <button class="look" data-look="none" disabled>Original</button>
    </div>
    <label
      ><input id="previewRes" type="checkbox" checked /> preview resolution (long edge 1600) instead
      of full resolution</label
    >
    <div class="row">
      <button id="baseline" disabled>Canvas 2D baseline (1 pass, full res)</button>
    </div>
    <canvas id="out"></canvas>

    <h2>3. Result</h2>
    <table id="result"></table>

    <h2>Device</h2>
    <table id="device"></table>
    <h2>Log</h2>
    <pre id="log"></pre>

    <script type="module" src="./main.js"></script>
  </body>
</html>
